<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>安全测试页面</title>
  <style>
    :root { --ink: #172033; --accent: #e83e65; }
    .deck { width: 1920px; }
    .slide { position: relative; width: 1920px; height: 1080px; background: #fff; }
    h1 { position: absolute; left: 120px; top: 120px; font-size: 72px; color: var(--ink); }
    p { position: absolute; left: 120px; top: 280px; font-size: 32px; color: var(--accent); }
  </style>
</head>
<body>
  <main class="deck" data-deck>
    <section class="slide" data-slide-id="slide-01" data-screen-label="01">
      <h1>安全页面</h1>
      <p>这是一页本地测试内容。</p>
    </section>
  </main>
</body>
</html>
